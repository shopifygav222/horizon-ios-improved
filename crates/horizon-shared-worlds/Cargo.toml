[package]
name = "horizon-shared-worlds"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared worlds: one save a group of friends owns, kept in their own storage bucket, hosted by whoever is playing"

[dependencies]
sha2 = "0.10"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
# The bucket's S3 API over HTTPS (rustls), as the game's other downloads.
ureq = { version = "2", default-features = false, features = ["tls"] }
# The request time S3's signature carries.
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
log = "0.4"

[lints]
workspace = true
