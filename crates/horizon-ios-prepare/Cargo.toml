[package]
name = "horizon-ios-prepare"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Starling's game files on iOS without Java: horizon-prepare's tables, made in CI, and the player's own verified Mojang files"
publish = false

[dependencies]
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# Asset objects the player's download lacks, fetched by their hash from Mojang's server.
ureq = { version = "2", default-features = false, features = ["tls"] }

[lints]
workspace = true
