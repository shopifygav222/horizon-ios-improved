name: shared-worlds
# The shared worlds crate (crates/horizon-shared-worlds): its layout, its lints with warnings as
# errors, its tests, and the same flows against a real S3 API (MinIO, started here).
on:
  push:
    branches: [shared-worlds]
    paths:
      - .github/workflows/shared-worlds.yml
      - crates/horizon-shared-worlds/**
      - tools/ci/s3_server.sh
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-worlds-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never

jobs:
  crate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shared-worlds
          cache-on-failure: true
      # On a layout slip the patch that fixes it is kept (git apply), and the run goes on to the
      # lints and tests so one run reports everything.
      - name: Formatting
        id: format
        continue-on-error: true
        run: |
          cargo fmt -p horizon-shared-worlds
          git diff --exit-code > format.patch || { cat format.patch; exit 1; }
      - uses: actions/upload-artifact@v4
        if: steps.format.outcome == 'failure'
        with:
          name: format-patch
          path: format.patch
      - name: Put the tree back as it was pushed
        run: git checkout -- .
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --keep-going -p horizon-shared-worlds --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test -p horizon-shared-worlds
      - name: Start an S3 server
        if: ${{ !cancelled() }}
        run: bash tools/ci/s3_server.sh
      # The live tests pass without doing anything when no server is given: make sure one is.
      - name: Test against the S3 server
        if: ${{ !cancelled() }}
        run: |
          test -n "$SHARED_WORLDS_S3_ENDPOINT"
          cargo test -p horizon-shared-worlds --test s3_live -- --nocapture
      - name: The layout must be right too
        if: steps.format.outcome == 'failure'
        run: exit 1
