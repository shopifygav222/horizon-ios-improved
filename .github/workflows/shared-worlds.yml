name: shared-worlds
# The shared worlds crate (crates/horizon-shared-worlds): its layout, its lints with warnings as
# errors, its tests, and the same flows against a real S3 API (MinIO, started here).
on:
  push:
    branches: [shared-worlds]
    paths:
      - .github/workflows/shared-worlds.yml
      - crates/horizon-shared-worlds/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-worlds-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never

jobs:
  crate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shared-worlds
          cache-on-failure: true
      # On a layout slip the patch that fixes it is kept (git apply), and the run goes on to the
      # lints and tests so one run reports everything.
      - name: Formatting
        id: format
        continue-on-error: true
        run: |
          cargo fmt -p horizon-shared-worlds
          git diff --exit-code > format.patch || { cat format.patch; exit 1; }
      - uses: actions/upload-artifact@v4
        if: steps.format.outcome == 'failure'
        with:
          name: format-patch
          path: format.patch
      - name: Put the tree back as it was pushed
        run: git checkout -- .
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --keep-going -p horizon-shared-worlds --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test -p horizon-shared-worlds
      - name: Start an S3 server
        if: ${{ !cancelled() }}
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=sharedworlds -e MINIO_ROOT_PASSWORD=sharedworlds-secret \
            minio/minio server /data
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
          AWS_ACCESS_KEY_ID=sharedworlds AWS_SECRET_ACCESS_KEY=sharedworlds-secret AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://shared-worlds-test
      - name: Test against the S3 server
        if: ${{ !cancelled() }}
        env:
          SHARED_WORLDS_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_WORLDS_S3_BUCKET: shared-worlds-test
          SHARED_WORLDS_S3_KEY: sharedworlds
          SHARED_WORLDS_S3_SECRET: sharedworlds-secret
        run: cargo test -p horizon-shared-worlds --test s3_live -- --nocapture
      - name: The layout must be right too
        if: steps.format.outcome == 'failure'
        run: exit 1
