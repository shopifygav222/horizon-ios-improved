name: ios
run-name: iOS · ${{ github.sha }}
# The game for iPhone and iPad: `horizon-ios-game` (Android's launcher and game, drawn with Metal)
# cross-compiled for aarch64-apple-ios, wrapped by packaging/ios/project.yml's HorizonGame target with
# the generated engine tables Android's APK carries, and uploaded as an unsigned .ipa.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
env:
  HORIZON_TELEMETRY_URL: "off"
  IOS_TARGET: aarch64-apple-ios
  # Release with fewer codegen passes: the release profile's single unit and LTO cost minutes, and
  # the unsigned bundle is a test build.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_INCREMENTAL: "0"
  # The app's own minimum (project.yml); rustc and cc read it, and the Xcode step's Cargo phase sees the same.
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the Apple toolchain
        run: bash tools/ci/ios-toolchain.sh
      - name: Install Rust and its iOS standard library
        # rust-toolchain.toml pins the compiler; the target must go to that toolchain, not to `stable`.
        run: |
          rustup show
          rustup target add "$IOS_TARGET"
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-${{ env.IOS_TARGET }}
          # Keep what compiled even when the game itself did not, so the next run starts from there.
          cache-on-failure: true
      - name: Build the game
        env:
          HORIZON_IOS_PUBLIC: "1"
          # The Microsoft sign-in app (account.rs): a repository variable, else the built-in one.
          HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
        # The default features, as Android's APK: sound and WebAssembly mods (run by Pulley on iOS).
        # --keep-going: every crate that can be built is, so one run reports every error.
        run: |
          export HORIZON_IOS_BUILD_COMMIT="$GITHUB_SHA"
          cargo build --release --keep-going --target "$IOS_TARGET" -p horizon-ios-game
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare engine tables from official downloads
        # As Android's dev builds: Mojang's files, checked against their hashes, never redistributed.
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Package the generated engine tables
        run: python3 tools/ios_engine_data.py
      - name: Bundle it
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          ( cd packaging/ios && xcodegen generate )
          HORIZON_GAME_PREBUILT=1 xcodebuild -project packaging/ios/HorizonIOS.xcodeproj \
            -target HorizonGame -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CONFIGURATION_BUILD_DIR="$PWD/build-ios" \
            build > xcode-game-build.log 2>&1 || { tail -60 xcode-game-build.log; exit 1; }
          app=build-ios/HorizonGame.app
          test -f "$app/engine-data.zip" || { echo '::error::the app has no engine-data.zip'; exit 1; }
          cmp -s "$app/Horizon" "target/$IOS_TARGET/release/horizon-ios-game" \
            || { echo '::error::the app does not contain the Rust game'; exit 1; }
          rm -rf game && mkdir -p game/Payload
          cp -a "$app" game/Payload/
          ( cd game && zip -qry ../Horizon-iOS-unsigned.ipa Payload )
          ls -l Horizon-iOS-unsigned.ipa
      - name: Preserve the Xcode log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-log
          path: xcode-game-build.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Check the distributable carries no Mojang files
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('Horizon-iOS-unsigned.ipa') as ipa:
              names = ipa.namelist()
          bad = [n for n in names if n.endswith(('.jar', '.ogg')) or '/minecraft/' in n or n.endswith('asset-index.json')]
          if bad:
              raise SystemExit(f'::error::the .ipa carries game files: {bad[:5]}')
          print(f'{len(names)} entries, none of them Mojang files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-${{ github.run_number }}
          path: Horizon-iOS-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
