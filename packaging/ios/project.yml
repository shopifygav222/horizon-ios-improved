# Horizon's iOS app, as an XcodeGen spec.
#
# Xcode does not like being edited in source control, so the repository keeps this file and
# `xcodegen` writes HorizonIOS.xcodeproj from it:
#   brew install xcodegen && cd packaging/ios && xcodegen generate
# Generating from this directory matters: $(SRCROOT) below is this directory.
#
# The game is the `horizon-ios-game` binary (crates/horizon-client/src/ios_main.rs): Android's
# launcher and game, drawn with Metal. Xcode wraps it so the bundle can be signed, and copies the
# engine tables in beside it as Android's APK carries them. .github/workflows/ios.yml runs the same
# steps for the unsigned .ipa.
name: HorizonIOS
options:
  pathBase: project
  createIntermediateGroups: true
  # A format every Xcode since 15.3 opens.
  projectFormat: xcode15_3
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: 0.7.8
    CURRENT_PROJECT_VERSION: 1
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    # The targets write their own Info.plist (GENERATE_INFOPLIST_FILE: NO), which names the icon.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # A build setting rather than the workflow's environment: build phases get Xcode's environment,
    # and both scripts below must ask for the same target the workflow builds.
    IOS_TARGET: aarch64-apple-ios
targets:
  # A diagnostic shell around crates/horizon-ios (`horizon_probe`), not the game.
  Horizon:
    type: application
    platform: iOS
    productName: Horizon
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.ios
        PRODUCT_NAME: Horizon
        TARGETED_DEVICE_FAMILY: "1,2"
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../crates/horizon-ios/include
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../target/aarch64-apple-ios/release
        OTHER_LDFLAGS:
          - $(inherited)
          - -lhorizon_ios

  # The game, in a bundle Xcode can sign:
  #
  #   1. Cargo builds `horizon-ios-game` for the phone (the pre-compile phase).
  #   2. Xcode links GameShell/main.m, which only gives the target an executable.
  #   3. The post-compile phase replaces that executable with the Rust one and adds the engine data;
  #      Xcode signs the bundle afterwards, so what reaches the phone carries a valid signature.
  HorizonGame:
    type: application
    platform: iOS
    productName: HorizonGame
    sources:
      - path: GameShell
      - path: Assets.xcassets
    preBuildScripts:
      - name: Build the game with Cargo
        shell: /bin/bash
        showEnvVarsInLog: false
        script: |
          set -euo pipefail
          # Xcode's build phases do not get your shell's PATH; rustup's binaries live in ~/.cargo/bin.
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo >/dev/null 2>&1 || {
            echo "error: no cargo on PATH. Install Rust with https://rustup.rs, or run Xcode from a terminal." >&2
            exit 1
          }
          sysroot=$(rustc --print sysroot)
          test -d "$sysroot/lib/rustlib/$IOS_TARGET/lib" || {
            echo "error: Rust has no standard library for $IOS_TARGET. Run: rustup target add $IOS_TARGET" >&2
            exit 1
          }
          cd "$SRCROOT/../.."
          # CI builds the game in its own step first and sets this, so the bundle step does not compile it twice.
          if [ -n "${HORIZON_GAME_PREBUILT:-}" ] && [ -x "target/$IOS_TARGET/release/horizon-ios-game" ]; then
            echo "Horizon: using the game Cargo already built (HORIZON_GAME_PREBUILT)."
            exit 0
          fi
          # The workflow's build: the default features, as Android's APK. Sound is cpal over CoreAudio,
          # controllers come from GameController, and WebAssembly mods run in wasmtime's Pulley
          # interpreter, since iOS allows no machine code made at run time.
          cargo build --release --target "$IOS_TARGET" -p horizon-ios-game
    postCompileScripts:
      - name: Put the Rust game and its engine data in the bundle
        shell: /bin/bash
        showEnvVarsInLog: false
        script: |
          set -euo pipefail
          root="$SRCROOT/../.."
          game="$root/target/$IOS_TARGET/release/horizon-ios-game"
          test -x "$game" || {
            echo "error: the Cargo phase reported success and left no $game" >&2
            exit 1
          }
          bundle="$BUILT_PRODUCTS_DIR/$WRAPPER_NAME"
          cp "$game" "$bundle/$EXECUTABLE_NAME"
          chmod +x "$bundle/$EXECUTABLE_NAME"
          echo "Horizon: $bundle/$EXECUTABLE_NAME is now the Rust game, $(stat -f %z "$bundle/$EXECUTABLE_NAME") bytes."
          # The generated engine tables (tools/android_prepare.py, then tools/ios_engine_data.py),
          # as Android's APK carries them. Without them the launcher can't install the game.
          engine="$root/.local/android/engine-data-generated.zip"
          if [ -f "$engine" ]; then
            cp "$engine" "$bundle/engine-data.zip"
            echo "Horizon: bundled $engine."
          else
            echo "warning: no $engine; run tools/android_prepare.py, then tools/ios_engine_data.py."
          fi
    settings:
      base:
        INFOPLIST_FILE: GameInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.game
        PRODUCT_NAME: HorizonGame
        TARGETED_DEVICE_FAMILY: "1,2"
        # The name inside the bundle, so GameInfo.plist's CFBundleExecutable is true of this build.
        EXECUTABLE_NAME: Horizon

schemes:
  Horizon shell:
    build:
      targets:
        Horizon: All
    run:
      config: Release
  Horizon game:
    build:
      targets:
        HorizonGame: All
    run:
      config: Release
